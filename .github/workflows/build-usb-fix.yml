name: Build USB OTG Fix APK

on:
  push:
    branches: [ "master" ]
    paths:
      - '.github/workflows/build-usb-fix.yml'
      - '.github/scripts/patch_usb_fix.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Add swap
        run: |
          sudo fallocate -l 8G /mnt/swapfile.ci
          sudo chmod 600 /mnt/swapfile.ci
          sudo mkswap /mnt/swapfile.ci
          sudo swapon /mnt/swapfile.ci

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: |
          cat > local.properties <<'EOF'
          POSTHOG_API_KEY=dummy
          POSTHOG_HOST=https://us.i.posthog.com
          STEAMGRIDDB_API_KEY=dummy
          CLOUD_PROJECT_NUMBER=dummy
          EOF

      - name: Apply Samsung USB OTG fix
        run: python3 .github/scripts/patch_usb_fix.py

      - name: Build Legacy Debug Bundle
        run: |
          chmod +x gradlew
          ./gradlew -Pkotlin.daemon.jvmargs=-Xmx3g :app:bundleLegacyDebug --no-daemon

      - name: Build universal APK
        run: |
          java -jar tools/bundletool-all-1.17.2.jar build-apks --bundle=app/build/outputs/bundle/legacyDebug/app-legacy-debug.aab --output=GameNative-USB-Fix.apks --mode=universal
          unzip -p GameNative-USB-Fix.apks universal.apk > GameNative-USB-Fix.apk

      - name: Upload USB Fix APK
        uses: actions/upload-artifact@v4
        with:
          name: GameNative-USB-Fix
          path: GameNative-USB-Fix.apk
          retention-days: 7
